# =============================================================================
# Local development stack (Docker). Never used for production deployments.
#
# WordPress and WP-CLI run in containers, so the host needs neither PHP nor
# nginx — only Docker with the Compose v2 plugin.
#
# The DATABASE IS EXTERNAL: no database container is started here. Connection
# details come from the site config (DB_HOST/DB_PORT/DB_NAME/DB_USER/
# DB_PASSWORD); the database and its user must already exist.
#
# Variables are exported by bin/dev from the site config (sites/<domain>.env).
# Do NOT run `docker compose` directly against this file: without those exports
# every interpolation resolves to an empty value. Use `bash bin/dev <command>`.
# =============================================================================

services:
  wordpress:
    image: ${DEV_WP_IMAGE}
    restart: unless-stopped
    ports:
      # Bound to DEV_BIND_ADDR (127.0.0.1 by default): not exposed to the LAN.
      - "${DEV_BIND_ADDR}:${DEV_HTTP_PORT}:80"
    environment:
      # DEV_DB_HOST is host.docker.internal when the database listens on the
      # host loopback, or the real IP/hostname when it is remote.
      WORDPRESS_DB_HOST: ${DEV_DB_HOST}:${DB_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DEV_TABLE_PREFIX}
      WORDPRESS_HOME: ${DEV_URL}
      WORDPRESS_SITEURL: ${DEV_URL}
      # Run apache as the host user so every file WordPress creates (uploads,
      # plugin installs, core updates) stays editable from the host. The php
      # apache image honours these, and the WordPress entrypoint chowns the
      # document root to the same ids. '#' means "numeric id" for apache.
      APACHE_RUN_USER: "#${DEV_UID}"
      APACHE_RUN_GROUP: "#${DEV_GID}"
      # Development defaults: log to wp-content/debug.log, never to the page.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      # Named volume by default; an absolute path when DEV_DOCROOT is set.
      - ${DEV_WP_SOURCE}:/var/www/html
    extra_hosts:
      # Lets the container reach a database running on the Docker host.
      - "host.docker.internal:host-gateway"

  cli:
    # On-demand WP-CLI: `bash bin/dev wp <args>`. Never started by `up`.
    image: ${DEV_CLI_IMAGE}
    profiles: ["cli"]
    # Same identity as apache, so files created by WP-CLI match the rest.
    user: "${DEV_UID}:${DEV_GID}"
    environment:
      # The image default HOME is www-data's; with a custom uid it may not be
      # writable, and WP-CLI wants somewhere for its cache.
      HOME: /tmp
      WORDPRESS_DB_HOST: ${DEV_DB_HOST}:${DB_PORT}
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${DEV_TABLE_PREFIX}
    volumes:
      - ${DEV_WP_SOURCE}:/var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wp_data:
